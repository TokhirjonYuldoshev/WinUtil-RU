name: Compile & Check

on:
  push:
    branches: ["main", "russian", "update/*"]
  pull_request:
    branches: ["main", "russian"]
  workflow_dispatch:
  workflow_call:

jobs:
  Compile-and-Check:
    runs-on: windows-latest
    steps:
    - name: Checkout Sources
      uses: actions/checkout@v7

      with:
        fetch-depth: 0

    - name: Compile and Syntax check winutil.ps1
      shell: pwsh
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        ./Compile.ps1
        $tokens = $null
        $parseErrors = $null
        [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'winutil.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
        if ($parseErrors.Count -gt 0) { throw ($parseErrors.Message -join [Environment]::NewLine) }
      continue-on-error: false

    - name: Validate Russian standalone and WPF
      if: github.base_ref == 'russian' || github.ref_name == 'russian' || startsWith(github.head_ref, 'update/') || startsWith(github.ref_name, 'update/')
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        .\tools\Build-WinUtilRussianRelease.ps1 -Channel beta

    - name: Upload Russian validation artifact
      if: github.base_ref == 'russian' || github.ref_name == 'russian' || startsWith(github.head_ref, 'update/') || startsWith(github.ref_name, 'update/')
      uses: actions/upload-artifact@v4
      with:
        name: WinUtil-RU-validation-${{ github.sha }}
        path: |
          dist/winutil-RU.ps1
          dist/release.json
          dist/LICENSE
