name: WinUtil RU Documentation Sync
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winutil-ru-documentation-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'TokhirjonYuldoshev/WinUtil-RU' && github.ref == 'refs/heads/russian'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: russian
          persist-credentials: true
          fetch-depth: 0
      - name: Prevent duplicate sync PR
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = russian
          count=$(gh pr list --repo TokhirjonYuldoshev/WinUtil-RU --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/docs-sync-"))] | length')
          if [ "$count" -gt 0 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Update bounded release metadata blocks
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/automation/Sync-WinUtilReleaseDocs.ps1
      - name: Review allowlist and create PR (never merge)
        if: steps.existing.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only)
          if [ -z "$files" ]; then
            echo 'No documentation changes needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              README.md|README.en.md|docs/README-RU.md|docs/AUTOMATION-RU.md) ;;
              *) echo "Unexpected path: $file" >&2; exit 1 ;;
            esac
          done <<< "$files"
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"
          branch="automation/docs-sync-$RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md README.en.md docs/README-RU.md docs/AUTOMATION-RU.md
          git commit -m 'docs: synchronize verified published release metadata'
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo TokhirjonYuldoshev/WinUtil-RU --base russian --head "$branch" --title 'docs: synchronize verified stable metadata' --body 'Generated from verified GitHub published releases and pinned upstream baseline. Restricted to bounded documentation blocks. No backend, runtime, releases or tags changed. Requires normal checks and review; no auto-merge.'
