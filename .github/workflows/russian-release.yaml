name: Russian Release

on:
  push:
    branches: ["russian"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Russian standalone artifact
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\tools\Build-WinUtilRussianRelease.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowManager-RU
          path: |
            dist/WindowManager-RU.ps1
            dist/release.json

      - name: Publish stable GitHub Release
        if: github.ref == 'refs/heads/russian'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content .\dist\release.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $tag = "ru-v$($manifest.Version)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release $tag already exists. Bump localization_ru.json Meta.Version before the next stable promotion."
          }
          gh release create $tag "dist/WindowManager-RU.ps1" "dist/release.json" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WindowManager RU $($manifest.Version)" --generate-notes
